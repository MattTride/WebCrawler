name: Build release packages

# Build the macOS and Windows desktop packages on real runners (PyInstaller
# cannot cross-compile). Triggered by pushing a version tag like `v1.0.0`,
# or manually from the Actions tab. On a tag, both packages are attached to
# the matching GitHub Release, so the README's "latest release" links work.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (arm64); shorter runner queue
            label: macOS
            asset: WebCrawler-macOS.zip
          - os: windows-latest
            label: Windows
            asset: WebCrawler-Windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build macOS .app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm crawler_app.spec
          ditto -c -k --keepParent "dist/WebCrawler.app" "${{ matrix.asset }}"

      - name: Build Windows .exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name WebCrawler crawler_app.py
          Compress-Archive -Path dist/WebCrawler.exe -DestinationPath "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
